# Fetch fresh data, rebuild the site, deploy to Cloudflare Pages.
# THE TIMER IS A CLOUDFLARE WORKER (workers/refresh-timer, cron 7,37 * * * *), not GitHub: it starts this workflow with workflow_dispatch
# every 30 minutes. GitHub's own `schedule:` skipped most runs, so it was removed. Do not add a schedule here or runs will start twice.
# Also runs on every push to main (live site) or dev (private preview link) and can be started by hand (Actions tab > Refresh and deploy > Run workflow).
name: Refresh and deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: refresh-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IC_USER_AGENT: ${{ secrets.IC_USER_AGENT }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
      IDAHO511_API_KEY: ${{ secrets.IDAHO511_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Last-known data lives in data/parts between runs, so a failed source shows stale values instead of blank.
      - name: Restore last-known data
        uses: actions/cache@v4
        with:
          path: data/parts
          key: parts-${{ github.run_id }}
          restore-keys: parts-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and build conditions.json
        run: ./scripts/refresh_all.sh

      # Yellow warning per source that is down, with how long. Never stops the deploy: the site keeps showing last-known data
      # with its stale labels. Exit 1 only when every source is down; that is turned into a failed run AFTER the deploy (last step).
      - name: Source health
        id: health
        continue-on-error: true
        run: python3 scripts/source_health.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node_modules is cached on the lockfile, so npm ci only runs when package-lock.json changes.
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      # Indexing is off until the repository variable PUBLIC_ALLOW_INDEX is set to true (Settings > Secrets and variables > Actions > Variables).
      # Only builds of main can turn it on; the dev preview always stays noindex. Unset or any other value keeps noindex and Disallow: /.
      - name: Build site
        env:
          PUBLIC_ALLOW_INDEX: ${{ github.ref_name == 'main' && vars.PUBLIC_ALLOW_INDEX || '' }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=idahoconditions --branch=${{ github.ref_name }}

      # The deploy above already published the stale labels. Failing here sends GitHub's failure email only when the site really is stale.
      - name: Fail the run if every source is down
        if: steps.health.outcome == 'failure'
        run: |
          echo "Every data source is down (or conditions.json is unreadable). See the Source health step."
          exit 1
