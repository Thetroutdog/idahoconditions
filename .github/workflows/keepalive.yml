# Keeps the scheduled workflows alive on a PUBLIC repo. GitHub disables scheduled workflows after 60 days without repository activity,
# and this site's workflows never commit anything, so without this the 30-minute refresh would quietly stop.
# While the repo is private this does nothing (the guard below), so it costs nothing and is safe to leave in place.
# It writes one line to .github/keepalive.txt on main once a month. A push made with GITHUB_TOKEN does not start other workflows.
# If main is protected against pushes, either allow github-actions[bot] to bypass, or delete this file and make a small commit yourself every ~6 weeks.
name: Keep scheduled workflows alive

on:
  schedule:
    - cron: "41 9 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Commit a timestamp
        run: |
          date -u +"Last keep-alive: %Y-%m-%d %H:%M UTC" > .github/keepalive.txt
          git config user.name "idahoconditions-bot"
          git config user.email "bot@idahoconditions.com"
          git add .github/keepalive.txt
          git commit -m "Keep scheduled workflows alive"
          git push
